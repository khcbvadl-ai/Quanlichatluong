<script>
let priceMap = {}; 
let allData = [];
let currentFilteredData = [];

const SHEET_ID = "1G2SbJcyAy1GYwe16cwaMmphRMaA609ow5l53aHwVw_w"; 
const SHEET_SO_LUONG = "So_luong_dat";
const SHEET_THONG_TIN = "Thong_tin_chung";

// 1. Tải dữ liệu từ Google Sheets
function loadData() {
    const urlSoLuong = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_SO_LUONG)}`;
    const urlThongTin = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_THONG_TIN)}`;

    Promise.all([
        fetch(urlThongTin).then(res => { if(!res.ok) throw new Error("Lỗi tải Thong_tin_chung"); return res.text(); }),
        fetch(urlSoLuong).then(res => { if(!res.ok) throw new Error("Lỗi tải So_luong_dat"); return res.text(); })
    ])
    .then(([csvThongTin, csvSoLuong]) => {
        parsePriceData(csvThongTin);
        parseOrderData(csvSoLuong);
        populateFilters();
        applyFilter();
    })
    .catch(err => {
        console.error("Lỗi tải dữ liệu:", err);
        const tbody = document.getElementById('table-body');
        if (tbody) {
            tbody.innerHTML = '<tr><td colspan="12" style="color:red; text-align:center; padding:20px;">Lỗi tải dữ liệu. Vui lòng kiểm tra quyền truy cập Sheet.</td></tr>';
        }
    });
}

// 2. Đọc bảng Thong_tin_chung
function parsePriceData(csvText) {
    let lines = csvText.split(/\r?\n/);
    priceMap = {
        'A1': { price: 74600, limitQty: 0, maxAmount: 0 },
        'A2': { price: 81300, limitQty: 0, maxAmount: 0 },
        'A3': { price: 87000, limitQty: 0, maxAmount: 0 },
        'A4': { price: 90600, limitQty: 0, maxAmount: 0 }
    };
    
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        let cols = parseCSVLine(lines[i]);
        if (cols.length >= 2) {
            let key = cols[1] ? cols[1].trim().toUpperCase() : "";
            if (key && priceMap.hasOwnProperty(key)) {
                let limitQty = cols[4] ? parseFloat(cols[4].replace(/[^0-9.-]+/g, "")) : 0;
                let price = cols[5] ? parseFloat(cols[5].replace(/[^0-9.-]+/g, "")) : priceMap[key].price;
                let maxAmount = cols[6] ? parseFloat(cols[6].replace(/[^0-9.-]+/g, "")) : 0;

                priceMap[key] = {
                    price: isNaN(price) ? priceMap[key].price : price,
                    limitQty: isNaN(limitQty) ? 0 : limitQty,
                    maxAmount: isNaN(maxAmount) ? 0 : maxAmount
                };
            }
        }
    }
}

// 3. Đọc dữ liệu đặt nước (Đọc thêm cột H=index 7, I=index 8, J=index 9, K=index 10)
function parseOrderData(csvText) {
    let lines = csvText.split(/\r?\n/);
    allData = [];
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        let cols = parseCSVLine(lines[i]);
        if (cols.length >= 7) {
            allData.push({
                unit: cols[1] ? cols[1].trim() : "",
                month: cols[2] ? cols[2].trim() : "",
                qty1: parseFloat(cols[3]) || 0,
                qty2: parseFloat(cols[4]) || 0,
                qty3: parseFloat(cols[5]) || 0,
                qty4: parseFloat(cols[6]) || 0,
                b1: cols[7] ? cols[7].trim() : "", // Cột H
                b2: cols[8] ? cols[8].trim() : "", // Cột I
                b3: cols[9] ? cols[9].trim() : "", // Cột J
                b4: cols[10] ? cols[10].trim() : "" // Cột K
            });
        }
    }
}

// 4. Render bảng dữ liệu chính
function renderTable(dataArray) {
    const tbody = document.getElementById('table-body');
    const tfoot = document.getElementById('table-foot');
    
    tbody.innerHTML = '';
    tfoot.innerHTML = '';

    if (!dataArray || dataArray.length === 0) {
        tbody.innerHTML = '<tr><td colspan="12" style="text-align:center; padding:15px;">Không tìm thấy dữ liệu phù hợp.</td></tr>';
        return;
    }

    let sumQty1 = 0, sumQty2 = 0, sumQty3 = 0, sumQty4 = 0;
    let sumAmt1 = 0, sumAmt2 = 0, sumAmt3 = 0, sumAmt4 = 0;
    let totalAllAmount = 0;

    dataArray.forEach((row, index) => {
        let amt1 = (row.qty1 || 0) * (priceMap['A1'] ? priceMap['A1'].price : 74600);
        let amt2 = (row.qty2 || 0) * (priceMap['A2'] ? priceMap['A2'].price : 81300);
        let amt3 = (row.qty3 || 0) * (priceMap['A3'] ? priceMap['A3'].price : 87000);
        let amt4 = (row.qty4 || 0) * (priceMap['A4'] ? priceMap['A4'].price : 90600);
        let rowTotal = amt1 + amt2 + amt3 + amt4;

        sumQty1 += (row.qty1 || 0);
        sumQty2 += (row.qty2 || 0);
        sumQty3 += (row.qty3 || 0);
        sumQty4 += (row.qty4 || 0);

        sumAmt1 += amt1;
        sumAmt2 += amt2;
        sumAmt3 += amt3;
        sumAmt4 += amt4;
        totalAllAmount += rowTotal;

        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${index + 1}</td>
            <td style="text-align: left;">${escapeHtml(row.unit)}</td>
            <td>${escapeHtml(row.month)}</td>
            <td>${formatNumber(row.qty1)}</td>
            <td>${formatNumber(row.qty2)}</td>
            <td>${formatNumber(row.qty3)}</td>
            <td>${formatNumber(row.qty4)}</td>
            <td>${formatCurrency(amt1)}</td>
            <td>${formatCurrency(amt2)}</td>
            <td>${formatCurrency(amt3)}</td>
            <td>${formatCurrency(amt4)}</td>
            <td style="font-weight: bold;">${formatCurrency(rowTotal)}</td>
        `;
        tbody.appendChild(tr);
    });

    let limitA1 = priceMap['A1'] ? priceMap['A1'].limitQty : 0;
    let limitA2 = priceMap['A2'] ? priceMap['A2'].limitQty : 0;
    let limitA3 = priceMap['A3'] ? priceMap['A3'].limitQty : 0;
    let limitA4 = priceMap['A4'] ? priceMap['A4'].limitQty : 0;

    let maxAmtA1 = priceMap['A1'] ? priceMap['A1'].maxAmount : 0;
    let maxAmtA2 = priceMap['A2'] ? priceMap['A2'].maxAmount : 0;
    let maxAmtA3 = priceMap['A3'] ? priceMap['A3'].maxAmount : 0;
    let maxAmtA4 = priceMap['A4'] ? priceMap['A4'].maxAmount : 0;

    let grandTotalMaxAmount = maxAmtA1 + maxAmtA2 + maxAmtA3 + maxAmtA4;

    let trTotal = document.createElement('tr');
    trTotal.className = 'row-total';
    trTotal.innerHTML = `
        <td colspan="3" style="text-align: center;">TỔNG CỘNG ĐĂNG KÝ</td>
        <td>${formatNumber(sumQty1)}</td>
        <td>${formatNumber(sumQty2)}</td>
        <td>${formatNumber(sumQty3)}</td>
        <td>${formatNumber(sumQty4)}</td>
        <td>${formatCurrency(sumAmt1)}</td>
        <td>${formatCurrency(sumAmt2)}</td>
        <td>${formatCurrency(sumAmt3)}</td>
        <td>${formatCurrency(sumAmt4)}</td>
        <td style="color: #2e7d32;">${formatCurrency(totalAllAmount)}</td>
    `;

    let trLimit = document.createElement('tr');
    trLimit.className = 'row-limit';
    trLimit.innerHTML = `
        <td colspan="3" style="text-align: center;">SỐ LƯỢNG GIỚI HẠN / TIỀN TỐI ĐA</td>
        <td style="color: #d84315;">${formatNumber(limitA1)}</td>
        <td style="color: #d84315;">${formatNumber(limitA2)}</td>
        <td style="color: #d84315;">${formatNumber(limitA3)}</td>
        <td style="color: #d84315;">${formatNumber(limitA4)}</td>
        <td style="color: #c62828;">${formatCurrency(maxAmtA1)}</td>
        <td style="color: #c62828;">${formatCurrency(maxAmtA2)}</td>
        <td style="color: #c62828;">${formatCurrency(maxAmtA3)}</td>
        <td style="color: #c62828;">${formatCurrency(maxAmtA4)}</td>
        <td style="color: #c62828; font-size: 1.05em;">${formatCurrency(grandTotalMaxAmount)}</td>
    `;

    tfoot.appendChild(trTotal);
    tfoot.appendChild(trLimit);
}

// 5. Hàm lọc và điều khiển bật/tắt nút Tạo biên bản
function applyFilter() {
    const unitVal = document.getElementById('unit-filter').value;
    const monthVal = document.getElementById('month-filter').value;

    currentFilteredData = allData.filter(item => {
        let matchUnit = !unitVal || item.unit === unitVal;
        let matchMonth = !monthVal || item.month === monthVal;
        return matchUnit && matchMonth;
    });

    renderTable(currentFilteredData);

    const btnCreate = document.getElementById('btn-create-doc');
    if (unitVal !== "" && monthVal !== "" && currentFilteredData.length > 0) {
        btnCreate.disabled = false;
    } else {
        btnCreate.disabled = true;
    }
}

function populateFilters() {
    const unitSelect = document.getElementById('unit-filter');
    const monthSelect = document.getElementById('month-filter');

    let units = [...new Set(allData.map(item => item.unit))].filter(Boolean);
    let months = [...new Set(allData.map(item => item.month))].filter(Boolean);

    unitSelect.innerHTML = '<option value="">-- Tất cả đơn vị --</option>';
    units.forEach(u => unitSelect.innerHTML += `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`);

    monthSelect.innerHTML = '<option value="">-- Tất cả tháng --</option>';
    months.forEach(m => monthSelect.innerHTML += `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`);
}

// 8. Đọc số tiền thành chữ Tiếng Việt chuẩn
function docSoThanhChu(so) {
    if (so === 0) return "Không đồng";
    const ChuSo = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
    function docTien3So(baso) {
        let tram = Math.floor(baso / 100);
        let chuc = Math.floor((baso % 100) / 10);
        let donvi = baso % 10;
        let ketqua = "";
        if (tram == 0 && chuc == 0 && donvi == 0) return "";
        if (tram != 0) {
            ketqua += ChuSo[tram] + " trăm";
            if ((chuc == 0) && (donvi != 0)) ketqua += " lẻ";
        }
        if ((chuc != 0) && (chuc != 1)) {
            ketqua += " " + ChuSo[chuc] + " mươi";
            if ((chuc == 0) && (donvi != 0)) ketqua = ketqua + " lẻ";
        }
        if (chuc == 1) ketqua += " mười";
        switch (donvi) {
            case 1:
                if ((chuc != 0) && (chuc != 1)) ketqua += " mốt";
                else ketqua += " " + ChuSo[donvi];
                break;
            case 5:
                if (chuc == 0) ketqua += " " + ChuSo[donvi];
                else ketqua += " lăm";
                break;
            default:
                if (donvi != 0) ketqua += " " + ChuSo[donvi];
                break;
        }
        return ketqua;
    }

    let str = "", i = 0;
    let Tien = [0, 0, 0, 0, 0];
    Tien[4] = Math.floor(so / 1000000000000);
    so = so % 1000000000000;
    Tien[3] = Math.floor(so / 1000000000);
    so = so % 1000000000;
    Tien[2] = Math.floor(so / 1000000);
    Tien[1] = Math.floor((so % 1000000) / 1000);
    Tien[0] = Math.floor(so % 1000);

    let HauTo = ["", "nghìn", "triệu", "tỷ", "nghìn tỷ"];
    for (i = 4; i >= 0; i--) {
        if (Tien[i] > 0) break;
    }
    for (let j = i; j >= 0; j--) {
        let hienthi = docTien3So(Tien[j]);
        str += hienthi + " " + HauTo[j] + " ";
    }
    str = str.trim();
    if (str.length > 0) str = str.substring(0, 1).toUpperCase() + str.substring(1);
    return str + " đồng";
}

// Các hàm bổ trợ
function formatNumber(num) {
    if (!num || isNaN(num)) return '0';
    return new Intl.NumberFormat('vi-VN').format(num);
}

function formatCurrency(amt) {
    if (!amt || isNaN(amt)) return '0 đ';
    return new Intl.NumberFormat('vi-VN').format(amt) + ' đ';
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function parseCSVLine(text) {
    let result = [];
    let cell = '';
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        let c = text[i];
        if (c === '"') {
            inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
            result.push(cell.trim().replace(/^"|"$/g, ''));
            cell = '';
        } else {
            cell += c;
        }
    }
    result.push(cell.trim().replace(/^"|"$/g, ''));
    return result;
}
