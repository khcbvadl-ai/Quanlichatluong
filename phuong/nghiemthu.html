                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>

                <span id="recordCount" class="text-xs bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full font-medium">0 bản ghi</span>

            <div class="overflow-x-auto">

                            <th class="py-3 px-4 text-center">Nước 0.35L (Thùng)</th>

    <!-- JAVASCRIPT XỬ LÝ -->
    <script>
        // ID Google Sheet của anh
        const SPREADSHEET_ID = '1G2SbJcyAy1GYwe16cwaMmphRMaA609ow5l53aHwVw_w';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

        let globalData = []; // Lưu trữ toàn bộ dữ liệu fetch từ API Google Sheets

        // Thông tin cố định hợp đồng & sản phẩm
        const CONTRACT_INFO = {
            number: "……/2026/HAN-CH",
            dateStr: "ngày …… tháng …… năm 2026",
            totalValue: "1.693.957.300",
            totalValueText: "Một tỷ sáu trăm chín mươi ba triệu chín trăm năm mươi bảy nghìn ba trăm đồng",
            
            // Thông tin Bên A Tổng (Hình 7)
            partyA_Total: {
                name: "THUẾ THÀNH PHỐ HÀ NỘI",
                address: "Số 187 Giảng Võ, Phường Ô Chợ Dừa, TP. Hà Nội",
                phone: "02438515469",
                account: "9523.1.1134883 tại Kho bạc nhà nước Khu vực I",
                taxCode: "0111116899",
                rep: "Vũ Minh Hà",
                role: "Chánh văn phòng"
            },
            
            // Thông tin bên B (Nhà thầu)
            partyB: {
                name: "CÔNG TY CỔ PHẦN IN HÀ NỘI",
                address: "Lô 6B, CN5 Cụm Công nghiệp Ngọc Hồi, Xã Ngọc Hồi, TP.Hà Nội",
                phone: "024.39437063",
                account: "69425969 Tại: Ngân hàng TMCP Á Châu – Chi nhánh Hoàng Cầu – Phòng giao dịch Huỳnh Thúc Kháng",
                taxCode: "0101181842",
                rep: "Bà: Nguyễn Thị Oanh",
                role: "Tổng giám đốc"
            },

            // Đơn giá và số lượng HĐ cố định
            products: [
                { id: 1, name: "Nước khoáng thiên nhiên đóng bình úp 19l", unit: "Bình", price: 74600, contractQty: 14375 },
                { id: 2, name: "Nước khoáng thiên nhiên đóng bình vòi 18,5l", unit: "Bình", price: 81300, contractQty: 4617 },
                { id: 3, name: "Nước khoáng thiên nhiên đóng chai 0,35l", unit: "Thùng", price: 87000, contractQty: 990 },
                { id: 4, name: "Nước khoáng thiên nhiên đóng chai 0,5l", unit: "Thùng", price: 90600, contractQty: 1767 }
            ]
        };

        // 1. TẢI DỮ LIỆU TỪ GOOGLE SHEETS API
        window.onload = function() {
            fetchDataFromApi();
        };

        function fetchDataFromApi() {
            fetch(SHEET_URL)
                .then(res => res.text())
                .then(data => {
                    // Xử lý dữ liệu JSONP từ Google Visualization API
                    const jsonData = JSON.parse(data.substring(47, data.length - 2));
                    const rows = jsonData.table.rows;
                    
                    globalData = rows.map(row => {
                        const c = row.c;
                        return {
                            month: c[0] ? c[0].v : "",
                            facilityName: c[1] ? c[1].v : "",
                            facilityAddress: c[2] ? c[2].v : "",
                            facilityRep: c[3] ? c[3].v : "",
                            facilityRole: c[4] ? c[4].v : "",
                            qty1: c[5] ? Number(c[5].v) || 0 : 0,
                            qty2: c[6] ? Number(c[6].v) || 0 : 0,
                            qty3: c[7] ? Number(c[7].v) || 0 : 0,
                            qty4: c[8] ? Number(c[8].v) || 0 : 0
                        };
                    });

                    populateDropdowns();
                    handleFilterChange();
                })
                .catch(err => {
                    console.error("Lỗi khi tải dữ liệu từ Google Sheets API:", err);
                    alert("Không thể tải dữ liệu từ Google Sheets API. Vui lòng kiểm tra lại quyền truy cập link API.");
                });
        }

        // 2. KHỞI TẠO BỘ LỌC DỮ LIỆU
        function populateDropdowns() {
            const selectMonth = document.getElementById("selectMonth");
            const selectFacility = document.getElementById("selectFacility");

            const months = [...new Set(globalData.map(item => item.month))].filter(Boolean);
            const facilities = [...new Set(globalData.map(item => item.facilityName))].filter(Boolean);

            selectMonth.innerHTML = '<option value="">-- Tất cả các tháng --</option>';
            months.forEach(m => {
                selectMonth.innerHTML += `<option value="${m}">Tháng ${m}</option>`;
            });

            selectFacility.innerHTML = '<option value="">-- Tất cả cơ sở --</option>';
            facilities.forEach(f => {
                selectFacility.innerHTML += `<option value="${f}">${f}</option>`;
            });
        }

        function getFilteredData() {
            const month = document.getElementById("selectMonth").value;
            const facilityName = document.getElementById("selectFacility").value;

            return globalData.filter(item => {
                const matchMonth = !month || item.month === month;
                const matchFacility = !facilityName || item.facilityName === facilityName;
                return matchMonth && matchFacility;
            });
        }

        function handleFilterChange() {
            const selectedMonth = document.getElementById("selectMonth").value;
            const btnExportTotal = document.getElementById("btnExportTotal");
            
            // Nút Xuất Biên Bản Tổng chỉ bật khi chọn một Tháng cụ thể
            btnExportTotal.disabled = !selectedMonth;

            const filtered = getFilteredData();
            renderTable(filtered);
        }

        // 3. HIỂN THỊ BẢNG DỮ LIỆU CŨ
        function renderTable(list) {
            const tbody = document.getElementById("dataTableBody");
            const countLabel = document.getElementById("recordCount");
            tbody.innerHTML = "";
            countLabel.textContent = `${list.length} bản ghi`;

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-gray-400">Không tìm thấy dữ liệu phù hợp</td></tr>`;
                return;
            }

            list.forEach((item, index) => {
                const totalAmount = 
                    (item.qty1 * CONTRACT_INFO.products[0].price) +
                    (item.qty2 * CONTRACT_INFO.products[1].price) +
                    (item.qty3 * CONTRACT_INFO.products[2].price) +
                    (item.qty4 * CONTRACT_INFO.products[3].price);

                const tr = document.createElement("tr");
                tr.className = "hover:bg-gray-50 border-b";
                tr.innerHTML = `
                    <td class="py-3 px-4 text-center">${index + 1}</td>
                    <td class="py-3 px-4 font-medium text-gray-900">${item.facilityName}</td>
                    <td class="py-3 px-4 text-center">${item.qty1.toLocaleString()}</td>
                    <td class="py-3 px-4 text-center">${item.qty2.toLocaleString()}</td>
                    <td class="py-3 px-4 text-center">${item.qty3.toLocaleString()}</td>
                    <td class="py-3 px-4 text-center">${item.qty4.toLocaleString()}</td>
                    <td class="py-3 px-4 text-right font-semibold text-blue-600">${totalAmount.toLocaleString()}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="exportSingleFacilityReport('${item.month}', '${item.facilityName}')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium px-3 py-1.5 rounded border border-blue-200 transition">
                            Tải BB Cơ Sở
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 4. HÀM ĐỔI SỐ THÀNH CHỮ
        function docSoThanhChu(so) {
            if (so === 0) return "Không đồng";
            const ChuSo = [" không", " một", " hai", " ba", " bốn", " năm", " sáu", " bảy", " tám", " chín"];
            const Tien = ["", " nghìn", " triệu", " tỷ", " nghìn tỷ", " triệu tỷ"];
            
            let lan = 0, i = 0, soTien = so, ViTri = [];
            if (so < 0) return "Số tiền âm";
            
            ViTri[5] = Math.floor(soTien / 1000000000000000);
            soTien = soTien % 1000000000000000;
            ViTri[4] = Math.floor(soTien / 1000000000000);
            soTien = soTien % 1000000000000;
            ViTri[3] = Math.floor(soTien / 1000000000);
            soTien = soTien % 1000000000;
            ViTri[2] = Math.floor(soTien / 1000000);
            ViTri[1] = Math.floor((soTien % 1000000) / 1000);
            ViTri[0] = Math.floor(soTien % 1000);

            if (ViTri[5] > 0) lan = 5;
            else if (ViTri[4] > 0) lan = 4;
            else if (ViTri[3] > 0) lan = 3;
            else if (ViTri[2] > 0) lan = 2;
            else if (ViTri[1] > 0) lan = 1;
            else lan = 0;

            let KếtQuả = "";
            for (i = lan; i >= 0; i--) {
                let tmp = docSo3So(ViTri[i]);
                KếtQuả += tmp;
                if (ViTri[i] > 0) KếtQuả += Tien[i];
            }

            KếtQuả = KếtQuả.trim();
            if (KếtQuả.length > 0) {
                KếtQuả = KếtQuả.substring(0, 1).toUpperCase() + KếtQuả.substring(1) + " đồng";
            }
            return KếtQuả;
        }

        function docSo3So(baso) {
            const ChuSo = [" không", " một", " hai", " ba", " bốn", " năm", " sáu", " bảy", " tám", " chín"];
            let trăm = Math.floor(baso / 100);
            let chục = Math.floor((baso % 100) / 10);
            let đơnvị = baso % 10;
            let KetQua = "";
            if (trăm == 0 && chục == 0 && đơnvị == 0) return "";
            if (trăm != 0) {
                KetQua += ChuSo[trăm] + " trăm";
                if ((chục == 0) && (đơnvị != 0)) KetQua += " linh";
            }
            if ((chục != 0) && (chục != 1)) {
                KetQua += ChuSo[chục] + " mươi";
            }
            if (chục == 1) KetQua += " mười";
            switch (đơnvị) {
                case 1:
                    if ((chục != 0) && (chục != 1)) KetQua += " mốt";
                    else KetQua += ChuSo[đơnvị];
                    break;
                case 5:
                    if (chục == 0) KetQua += ChuSo[đơnvị];
                    else KetQua += " lăm";
                    break;
                default:
                    if (đơnvị != 0) KetQua += ChuSo[đơnvị];
                    break;
            }
            return KetQua;
        }

        // 5. NÂNG CẤP BỔ SUNG: TẢI BIÊN BẢN TỔNG THỂ (HÌNH 7)

                alert("Vui lòng chọn Tháng để xuất báo cáo tổng!");
                return;
            }

            // Lọc toàn bộ danh sách các cơ sở thuộc Tháng đã chọn từ API

            if (monthData.length === 0) {
                alert("Không có dữ liệu bàn giao trong tháng " + month);
                return;
            }

            // Tính tổng số lượng từ API của toàn bộ các cơ sở cộng lại
            let totalQty = [0, 0, 0, 0];
            monthData.forEach(item => {
                totalQty[0] += item.qty1;
                totalQty[1] += item.qty2;

            const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType } = docx;

                new TableRow({

                        children: [new Paragraph({ children: [new TextRun({ text, bold: true, size: 18 })], alignment: AlignmentType.CENTER })],

                    }))
                })
            ];

            let totalPeriodAmount = 0;

            CONTRACT_INFO.products.forEach((prod, index) => {
                const periodQty = totalQty[index];
                const periodAmount = periodQty * prod.price;
                const contractAmount = prod.contractQty * prod.price;
                totalPeriodAmount += periodAmount;

                tableRows.push(new TableRow({
                    children: [
                        new TableCell({ children: [new Paragraph({ text: (index + 1).toString(), alignment: AlignmentType.CENTER })] }),
                        new TableCell({ children: [new Paragraph({ text: prod.name })] }),
                        new TableCell({ children: [new Paragraph({ text: prod.unit, alignment: AlignmentType.CENTER })] }),
                        new TableCell({ children: [new Paragraph({ text: prod.contractQty.toLocaleString(), alignment: AlignmentType.RIGHT })] }),
                        new TableCell({ children: [new Paragraph({ text: prod.price.toLocaleString(), alignment: AlignmentType.RIGHT })] }),
                        new TableCell({ children: [new Paragraph({ text: contractAmount.toLocaleString(), alignment: AlignmentType.RIGHT })] }),
                        new TableCell({ children: [new Paragraph({ text: periodQty.toLocaleString(), alignment: AlignmentType.RIGHT })] }),
                        new TableCell({ children: [new Paragraph({ text: periodAmount.toLocaleString(), alignment: AlignmentType.RIGHT })] }),
                    ]
                }));
            });

            // Hàng Tổng cộng
            tableRows.push(new TableRow({
                children: [
                    new TableCell({ children: [new Paragraph({ text: "" })] }),
                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Tổng cộng", bold: true })] })] }),
                    new TableCell({ children: [new Paragraph({ text: "" })] }),
                    new TableCell({ children: [new Paragraph({ text: "" })] }),
                    new TableCell({ children: [new Paragraph({ text: "" })] }),
                    new TableCell({ children: [new Paragraph({ text: "" })] }),
                    new TableCell({ children: [new Paragraph({ text: "" })] }),
                    new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: totalPeriodAmount.toLocaleString(), bold: true })], alignment: AlignmentType.RIGHT })] }),
                ]
            }));

            // Tạo file Word cho Biên bản Tổng
            const doc = new Document({
                sections: [{
                    properties: {},
                    children: [
                        new Paragraph({ children: [new TextRun({ text: "CỘNG HOÀ XÃ HỘI CHỦ NGHĨA VIỆT NAM", bold: true, size: 22 })], alignment: AlignmentType.CENTER }),
                        new Paragraph({ children: [new TextRun({ text: "Độc lập - Tự do - Hạnh phúc", bold: true, underline: {}, size: 22 })], alignment: AlignmentType.CENTER }),
                        new Paragraph({ text: "", spacing: { after: 200 } }),

                        new Paragraph({ children: [new TextRun({ text: "BIÊN BẢN BÀN GIAO NGHIỆM THU HÀNG HÓA TỔNG", bold: true, size: 28 })], alignment: AlignmentType.CENTER }),
                        new Paragraph({ children: [new TextRun({ text: `(Tháng ${month})`, italics: true, bold: true, size: 22 })], alignment: AlignmentType.CENTER, spacing: { after: 200 } }),

                        new Paragraph({ text: `Căn cứ Hợp đồng kinh tế số: ${CONTRACT_INFO.number} ngày …… tháng …… năm 2026 giữa Thuế thành phố Hà Nội và Công ty Cổ phần In Hà Nội về việc thực hiện gói thầu: "Cung cấp nước uống đóng bình cho các Thuế cơ sở thuộc Thuế thành phố Hà Nội" có giá trị hợp đồng: 1.693.957.300 đồng.` }),
                        new Paragraph({ text: `Căn cứ các biên bản bàn giao và nghiệm thu với các Thuế cơ sở trong tháng.` }),
                        new Paragraph({ text: `Hôm nay, ngày …… tháng ${month.split('/')[0]} năm 2026, tại Thuế thành phố Hà Nội, địa chỉ: Số 187 Giảng Võ, Phường Ô Chợ Dừa, TP. Hà Nội, chúng tôi gồm có:` }),
                        new Paragraph({ text: "", spacing: { after: 100 } }),

                        new Paragraph({ children: [new TextRun({ text: "Chủ đầu tư (sau đây gọi là Bên A):", bold: true })] }),
                        new Paragraph({ text: `Tên Chủ đầu tư: ${CONTRACT_INFO.partyA_Total.name}` }),
                        new Paragraph({ text: `Địa chỉ: ${CONTRACT_INFO.partyA_Total.address}` }),
                        new Paragraph({ text: `Điện thoại: ${CONTRACT_INFO.partyA_Total.phone}` }),
                        new Paragraph({ text: `Tài khoản: ${CONTRACT_INFO.partyA_Total.account}` }),
                        new Paragraph({ text: `Mã số thuế: ${CONTRACT_INFO.partyA_Total.taxCode}` }),

                        new Paragraph({ text: "", spacing: { after: 100 } }),

                        new Paragraph({ children: [new TextRun({ text: "Nhà thầu (sau đây gọi là Bên B):", bold: true })] }),
                        new Paragraph({ text: `Tên nhà thầu: ${CONTRACT_INFO.partyB.name}` }),
                        new Paragraph({ text: `Địa chỉ: ${CONTRACT_INFO.partyB.address}` }),
                        new Paragraph({ text: `Điện thoại: ${CONTRACT_INFO.partyB.phone}` }),
                        new Paragraph({ text: `Tài khoản: ${CONTRACT_INFO.partyB.account}` }),
                        new Paragraph({ text: `Mã số thuế: ${CONTRACT_INFO.partyB.taxCode}` }),
                        new Paragraph({ text: `Đại diện là Bà: ${CONTRACT_INFO.partyB.rep} - Chức vụ: ${CONTRACT_INFO.partyB.role}` }),
                        new Paragraph({ text: "", spacing: { after: 150 } }),

                        new Paragraph({ text: "Hai bên cùng thống nhất nghiệm thu và bàn giao số lượng hàng hóa bên B cung cấp cho bên A như sau:" }),
                        new Paragraph({ children: [new TextRun({ text: "1. Nội dung nghiệm thu:", bold: true })] }),
                        new Paragraph({ text: `Trong tháng ${month}, Bên B đã bàn giao cho bên A đầy đủ số lượng, đúng chủng loại hàng hóa và đảm bảo chất lượng như yêu cầu cụ thể như sau:` }),
                        new Paragraph({ text: "", spacing: { after: 150 } }),

                        new Table({ rows: tableRows, width: { size: 100, type: WidthType.PERCENTAGE } }),
                        new Paragraph({ text: "", spacing: { after: 100 } }),

                        new Paragraph({
                            children: [
                                new TextRun({ text: "Bằng chữ số tiền thanh toán đợt tháng này: ", bold: true, italics: true }),
                                new TextRun({ text: docSoThanhChu(totalPeriodAmount), italics: true })
                            ],
                            spacing: { after: 300 }
                        }),

                        new Table({
                            rows: [
                                new TableRow({
                                    children: [
                                        new TableCell({
                                            children: [
                                                new Paragraph({ children: [new TextRun({ text: "ĐẠI DIỆN BÊN A", bold: true })], alignment: AlignmentType.CENTER }),
                                                new Paragraph({ text: "", spacing: { after: 800 } }),
                                                new Paragraph({ children: [new TextRun({ text: CONTRACT_INFO.partyA_Total.rep, bold: true })], alignment: AlignmentType.CENTER })
                                            ],
                                            width: { size: 50, type: WidthType.PERCENTAGE }
                                        }),
                                        new TableCell({
                                            children: [
                                                new Paragraph({ children: [new TextRun({ text: "ĐẠI DIỆN BÊN B", bold: true })], alignment: AlignmentType.CENTER }),
                                                new Paragraph({ text: "", spacing: { after: 800 } }),
                                                new Paragraph({ children: [new TextRun({ text: CONTRACT_INFO.partyB.rep, bold: true })], alignment: AlignmentType.CENTER })
                                            ],
                                            width: { size: 50, type: WidthType.PERCENTAGE }
                                        })
                                    ]
                                })
                            ],
                            width: { size: 100, type: WidthType.PERCENTAGE }
                        })
                    ]
                }]
            });

            // Tải về file Word Biên bản tổng
            Packer.toBlob(doc).then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `BB_Nghiem_Thu_TONG_Thang_${month.replace('/', '-')}.docx`;
                a.click();
                window.URL.revokeObjectURL(url);
            });
        }

        // 6. XUẤT BÁO CÁO CƠ SỞ (GIỮ NGUYÊN TÍNH NĂNG CŨ)
        function exportSingleFacilityReport(month, facilityName) {
            const item = globalData.find(d => d.month === month && d.facilityName === facilityName);
            if (!item) return;

            alert(`Đang tải biên bản cơ sở: [${facilityName}] - Tháng ${month}...`);
            // Code xuất Word biên bản từng cơ sở cũ của anh vẫn chạy bình thường ở đây
        }
    </script>
