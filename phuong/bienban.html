<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BẢNG THỐNG KÊ ĐĂNG KÝ NƯỚC</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1b4d2e;
            margin-bottom: 20px;
            font-size: 20px;
        }

        /* Khối bộ lọc giữ nguyên kiểu dáng cũ & tối ưu kích thước trên di động */
        .filter-panel {
            background-color: #eaf2eb;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .filter-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-label {
            font-weight: bold;
            color: #1b4d2e;
            width: 80px;
            font-size: 14px;
        }

        .filter-control {
            flex: 1;
            min-width: 200px;
            max-width: 100%;
        }

        select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
        }

        /* Nhóm nút bấm */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background-color: #d2e3d5;
            color: #1b4d2e;
            border: 1px solid #b2d0b7;
            padding: 9px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #c0dbc4;
        }

        /* Style riêng cho nút Cập nhật mới */
        .btn-update {
            background-color: #1b4d2e;
            color: #ffffff;
            border: none;
        }

        .btn-update:hover {
            background-color: #143b22;
        }

        /* Bảng hiển thị - Tối ưu cuộn ngang mượt mà trên điện thoại */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #1b4d2e;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px; /* Giữ kích thước bảng chuẩn không bị bóp méo */
        }

        th, td {
            border: 1px solid #b2d0b7;
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }

        th {
            background-color: #1b4d2e;
            color: white;
            font-weight: bold;
        }

        th.sub-header {
            background-color: #1b4d2e;
        }

        td.text-left {
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>BẢNG THỐNG KÊ ĐĂNG KÝ NƯỚC</h2>

    <div class="filter-panel">
        <div class="filter-row">
            <span class="filter-label">ĐƠN VỊ:</span>
            <div class="filter-control">
                <select id="donViSelect" onchange="filterData()">
                    <option value="">-- Tất cả đơn vị --</option>
                </select>
            </div>
        </div>

        <div class="filter-row">
            <span class="filter-label">THÁNG:</span>
            <div class="filter-control">
                <select id="thangSelect" onchange="filterData()">
                    <option value="">-- Tất cả tháng --</option>
                </select>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" onclick="exportBienBanDonVi()">Biên bản Đơn vị</button>
            <button type="button" onclick="exportBienBanTongThe()">Biên bản Tổng thể (Hình 7)</button>
            <!-- NÚT CẬP NHẬT MỚI THÊM -->
            <button type="button" class="btn-update" onclick="window.location.reload();">🔄 Cập nhật</button>
        </div>
    </div>

    <div class="table-responsive">
        <table id="dataTable">
            <thead>
                <tr>
                    <th rowspan="2" style="width: 40px;">STT</th>
                    <th rowspan="2">Tên đơn vị</th>
                    <th rowspan="2" style="width: 70px;">Tháng</th>
                    <th colspan="2">Số lượng đặt (Bình)</th>
                </tr>
                <tr>
                    <th class="sub-header">Loại 1 (18.5L)</th>
                    <th class="sub-header">Loại 2 (19L)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dữ liệu đổ tự động từ Apps Script / JS giữ nguyên -->
                <tr>
                    <td>1</td>
                    <td class="text-left">Thuế cơ sở 12</td>
                    <td>9/2026</td>
                    <td></td>
                    <td>20</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td class="text-left">THUẾ CƠ SỞ 24 THÀNH PHỐ HÀ NỘI</td>
                    <td>9/2026</td>
                    <td>60</td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</script>

</body>
</html>
