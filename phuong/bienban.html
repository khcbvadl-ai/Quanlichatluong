<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Báo Cáo Xuất DOCX</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f6f8fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 32px;
      border-radius: 8px;
      border: 1px solid #d0d7de;
      box-shadow: 0 3px 6px rgba(140,149,159,0.15);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    h2 {
      color: #24292f;
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 20px;
    }
    p.desc {
      color: #57606a;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .info-box {
      background-color: #ddf4ff;
      border: 1px solid #54aeff;
      padding: 12px 16px;
      text-align: left;
      font-size: 13px;
      color: #0969da;
      margin-bottom: 24px;
      border-radius: 6px;
      line-height: 1.5;
    }
    .btn {
      background-color: #2da44e;
      color: #ffffff;
      border: 1px solid rgba(27,31,36,0.15);
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #2c974b;
    }
    .btn:disabled {
      background-color: #94d3a2;
      cursor: not-allowed;
    }
    .spinner {
      border: 2px solid #ffffff;
      border-top: 2px solid transparent;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #status {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
    }
    .success { color: #1a7f37; }
    .error { color: #cf222e; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Xuất Báo Cáo Nghiệm Thu</h2>
    <p class="desc">Chuyển đổi dữ liệu và tự động thay thế tên đơn vị thành <strong>"Thuế cơ sở 1"</strong></p>

    <div class="info-box">
      <strong>Quy trình thực hiện:</strong><br>
      • Đọc mẫu tài liệu trực tiếp từ Google Docs gốc.<br>
      • Thay thế từ khóa <code>B1</code> ➔ <strong>"Thuế cơ sở 1"</strong>.<br>
      • Xuất và tải file <code>.docx</code> về máy tính.
    </div>

    <button id="btn-submit" class="btn" onclick="generateReport()">
      <div id="spinner" class="spinner"></div>
      <span id="btn-text">Tạo & Tải Báo Cáo (.docx)</span>
    </button>

    <div id="status"></div>
  </div>

  <script>
    // Link Web App Apps Script của thầy
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxEoeI6pQYt2FV5DHFHbR1CqRZ7HDIogKjLOK5Y8lFzI6twyYsEUCstcNG9WIqXGDQ/exec";

    async function generateReport() {
      const btn = document.getElementById('btn-submit');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('spinner');
      const status = document.getElementById('status');

      btn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.innerText = 'Đang xử lý dữ liệu...';
      status.className = '';
      status.innerText = 'Đang gửi yêu cầu tới hệ thống...';

      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();

        if (data.success) {
          status.className = 'success';
          status.innerText = '✓ Hoàn tất! Đang tải xuống file .docx...';

          // Chuyển Base64 thành file Blob để kích hoạt tải xuống trên trình duyệt
          const byteCharacters = atob(data.base64Data);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          const byteArray = new Uint8Array(byteNumbers);
          const blob = new Blob([byteArray], { type: data.mimeType });

          // Tự động tải file xuống
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = data.fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

        } else {
          status.className = 'error';
          status.innerText = '✕ Lỗi xử lý: ' + data.error;
        }
      } catch (err) {
        status.className = 'error';
        status.innerText = '✕ Không thể kết nối API. Vui lòng kiểm tra lại cấu hình.';
        console.error(err);
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.innerText = 'Tạo & Tải Báo Cáo (.docx)';
      }
    }
  </script>
</body>
</html>
