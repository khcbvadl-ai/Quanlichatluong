<script>
let priceMap = {}; 
let allData = [];
let currentFilteredData = [];
let currentDocType = 'single';

const SHEET_ID = "1G2SbJcyAy1GYwe16cwaMmphRMaA609ow5l53aHwVw_w"; 
const SHEET_SO_LUONG = "So_luong_dat";
const SHEET_THONG_TIN = "Thong_tin_chung";

function formatNumber(num) {
    if (num === null || num === undefined || isNaN(num) || num === 0) return "";
    return new Intl.NumberFormat('vi-VN').format(num);
}

function formatCurrency(num) {
    if (num === null || num === undefined || isNaN(num)) return "0";
    return new Intl.NumberFormat('vi-VN').format(num);
}

function escapeHtml(text) {
    if (!text) return "";
    return text.toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function parseCSVLine(line) {
    let result = [];
    let insideQuote = false;
    let entry = '';
    for (let i = 0; i < line.length; i++) {
        let c = line[i];
        if (c === '"') {
            insideQuote = !insideQuote;
        } else if (c === ',' && !insideQuote) {
            result.push(entry.trim().replace(/^"|"$/g, ''));
            entry = '';
        } else {
            entry += c;
        }
    }
    result.push(entry.trim().replace(/^"|"$/g, ''));
    return result;
}

function parseNumber(val) {
    if (!val) return 0;
    let num = parseFloat(val.toString().replace(/[^0-9.-]+/g, ""));
    return isNaN(num) ? 0 : num;
}

function docSoThanhChu(so) {
    if (!so || isNaN(so) || so === 0) return "Không đồng";
    const chuSo = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
    
    function readGroup(group) {
        let read = "";
        let trăm = Math.floor(group / 100);
        let chục = Math.floor((group % 100) / 10);
        let đơnVị = group % 10;
        
        if (trăm > 0 || chục > 0 || đơnVị > 0) {
            read += chuSo[trăm] + " trăm ";
        }
        if (chục > 1) {
            read += chuSo[chục] + " mươi ";
            if (đơnVị === 1) read += "mốt ";
            else if (đơnVị === 5) read += "lăm ";
            else if (đơnVị > 0) read += chuSo[đơnVị] + " ";
        } else if (chục === 1) {
            read += "mười ";
            if (đơnVị === 1) read += "mốt ";
            else if (đơnVị === 5) read += "lăm ";
            else if (đơnVị > 0) read += chuSo[đơnVị] + " ";
        } else if (chục === 0 && đơnVị > 0) {
            if (trăm > 0) read += "lẻ ";
            read += chuSo[đơnVị] + " ";
        }
        return read;
    }

    let temp = Math.abs(so);
    let result = "";
    let units = ["", "nghìn", "triệu", "tỷ", "nghìn tỷ", "triệu tỷ"];
    let unitIdx = 0;

    while (temp > 0) {
        let group = temp % 1000;
        if (group > 0) {
            let strGroup = readGroup(group);
            result = strGroup + units[unitIdx] + " " + result;
        }
        temp = Math.floor(temp / 1000);
        unitIdx++;
    }

    result = result.trim();
    if (result.length > 0) {
        result = result.charAt(0).toUpperCase() + result.slice(1) + " đồng chẵn.";
    }
    return result;
}

document.addEventListener("DOMContentLoaded", loadData);

function loadData() {
    const urlSoLuong = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_SO_LUONG)}`;
    const urlThongTin = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_THONG_TIN)}`;

    Promise.all([
        fetch(urlThongTin).then(res => res.text()),
        fetch(urlSoLuong).then(res => res.text())
    ])
    .then(([csvThongTin, csvSoLuong]) => {
        parsePriceData(csvThongTin);
        parseOrderData(csvSoLuong);
        populateFilters();
        applyFilter();
    })
    .catch(err => {
        console.error("Lỗi tải dữ liệu:", err);
        document.getElementById('table-body').innerHTML = '<tr><td colspan="12">Lỗi không thể tải dữ liệu từ Google Sheet.</td></tr>';
    });
}

function parsePriceData(csvText) {
    let lines = csvText.split(/\r?\n/);
    priceMap = {
        'A1': { price: 74600, contractQty: 0, contractAmount: 0, name: "Nước khoáng đóng bình vòi 18,5l", unit: "Bình" },
        'A2': { price: 81300, contractQty: 0, contractAmount: 0, name: "Nước khoáng đóng bình úp 19l", unit: "Bình" },
        'A3': { price: 87000, contractQty: 0, contractAmount: 0, name: "Nước khoáng đóng chai 0,35l", unit: "Thùng" },
        'A4': { price: 90600, contractQty: 0, contractAmount: 0, name: "Nước khoáng đóng chai 0,5l", unit: "Thùng" }
    };
    
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        let cols = parseCSVLine(lines[i]);
        if (cols.length >= 2) {
            let key = cols[1] ? cols[1].trim().toUpperCase() : "";
            if (key && priceMap.hasOwnProperty(key)) {
                let contractQty = cols[4] ? parseNumber(cols[4]) : 0;
                let price = cols[5] ? parseNumber(cols[5]) : priceMap[key].price;
                let contractAmount = cols[6] ? parseNumber(cols[6]) : (contractQty * price);

                priceMap[key].price = price > 0 ? price : priceMap[key].price;
                priceMap[key].contractQty = contractQty;
                priceMap[key].contractAmount = contractAmount > 0 ? contractAmount : (contractQty * priceMap[key].price);
            }
        }
    }
}

function parseOrderData(csvText) {
    let lines = csvText.split(/\r?\n/);
    allData = [];
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        let cols = parseCSVLine(lines[i]);
        if (cols.length >= 7) {
            allData.push({
                unit: cols[1] ? cols[1].trim() : "",
                month: cols[2] ? cols[2].trim() : "",
                qty1: parseNumber(cols[3]),
                qty2: parseNumber(cols[4]),
                qty3: parseNumber(cols[5]),
                qty4: parseNumber(cols[6]),
                b1: cols[7] ? cols[7].trim() : "", 
                b2: cols[8] ? cols[8].trim() : "", 
                b3: cols[9] ? cols[9].trim() : "", 
                b4: cols[10] ? cols[10].trim() : "" 
            });
        }
    }
}

function renderTable(dataArray) {
    const tbody = document.getElementById('table-body');
    const tfoot = document.getElementById('table-foot');
    tbody.innerHTML = ''; tfoot.innerHTML = '';

    if (!dataArray || dataArray.length === 0) {
        tbody.innerHTML = '<tr><td colspan="12">Không tìm thấy dữ liệu.</td></tr>';
        return;
    }

    let sumQty1 = 0, sumQty2 = 0, sumQty3 = 0, sumQty4 = 0;
    let sumAmt1 = 0, sumAmt2 = 0, sumAmt3 = 0, sumAmt4 = 0;
    let totalAllAmount = 0;

    dataArray.forEach((row, index) => {
        let amt1 = row.qty1 * priceMap['A1'].price;
        let amt2 = row.qty2 * priceMap['A2'].price;
        let amt3 = row.qty3 * priceMap['A3'].price;
        let amt4 = row.qty4 * priceMap['A4'].price;
        let rowTotal = amt1 + amt2 + amt3 + amt4;

        sumQty1 += row.qty1; sumQty2 += row.qty2; sumQty3 += row.qty3; sumQty4 += row.qty4;
        sumAmt1 += amt1; sumAmt2 += amt2; sumAmt3 += amt3; sumAmt4 += amt4;
        totalAllAmount += rowTotal;

        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${index + 1}</td>
            <td style="text-align: left;">${escapeHtml(row.unit)}</td>
            <td>${escapeHtml(row.month)}</td>
            <td>${formatNumber(row.qty1)}</td>
            <td>${formatNumber(row.qty2)}</td>
            <td>${formatNumber(row.qty3)}</td>
            <td>${formatNumber(row.qty4)}</td>
            <td>${formatCurrency(amt1)}</td>
            <td>${formatCurrency(amt2)}</td>
            <td>${formatCurrency(amt3)}</td>
            <td>${formatCurrency(amt4)}</td>
            <td style="font-weight: bold;">${formatCurrency(rowTotal)}</td>
        `;
        tbody.appendChild(tr);
    });

    let trTotal = document.createElement('tr');
    trTotal.className = 'row-total';
    trTotal.innerHTML = `
        <td colspan="3">TỔNG CỘNG ĐĂNG KÝ</td>
        <td>${formatNumber(sumQty1)}</td><td>${formatNumber(sumQty2)}</td>
        <td>${formatNumber(sumQty3)}</td><td>${formatNumber(sumQty4)}</td>
        <td>${formatCurrency(sumAmt1)}</td><td>${formatCurrency(sumAmt2)}</td>
        <td>${formatCurrency(sumAmt3)}</td><td>${formatCurrency(sumAmt4)}</td>
        <td style="color: #2e7d32;">${formatCurrency(totalAllAmount)}</td>
    `;
    tfoot.appendChild(trTotal);
}

function applyFilter() {
    const unitVal = document.getElementById('unit-filter').value;
    const monthVal = document.getElementById('month-filter').value;

    currentFilteredData = allData.filter(item => {
        let matchUnit = !unitVal || item.unit === unitVal;
        let matchMonth = !monthVal || item.month === monthVal;
        return matchUnit && matchMonth;
    });

    renderTable(currentFilteredData);

    document.getElementById('btn-create-doc').disabled = !(unitVal !== "" && monthVal !== "" && currentFilteredData.length > 0);
    document.getElementById('btn-create-summary').disabled = !(currentFilteredData.length > 0 && monthVal !== "");
}

function populateFilters() {
    const unitSelect = document.getElementById('unit-filter');
    const monthSelect = document.getElementById('month-filter');
    let units = [...new Set(allData.map(item => item.unit))].filter(Boolean);
    let months = [...new Set(allData.map(item => item.month))].filter(Boolean);

    unitSelect.innerHTML = '<option value="">-- Tất cả đơn vị --</option>';
    units.forEach(u => unitSelect.innerHTML += `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`);

    monthSelect.innerHTML = '<option value="">-- Tất cả tháng --</option>';
    months.forEach(m => monthSelect.innerHTML += `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`);
}

function getCleanMonth(monthStr) {
    if (!monthStr) return "";
    return monthStr.toString().replace(/\/2026/g, "").replace(/2026/g, "").trim();
}

function openDocModal(type) {
    currentDocType = type;
    if (currentFilteredData.length === 0) return;

    if (type === 'single') {
        renderSingleDocPreview();
    } else {
        renderSummaryDocPreview();
    }

    document.getElementById('docModal').style.display = 'block';
}

function closeDocModal() {
    document.getElementById('docModal').style.display = 'none';
}

/* 1. PREVIEW BIÊN BẢN TỪNG ĐƠN VỊ (B1 được thay đổi thành "Thuế cơ sở 1") */
function renderSingleDocPreview() {

    let b1Raw = item.b1 || item.unit;
    let b1 = "Thuế cơ sở 1 " + b1Raw;
    let b1Upper = "THUẾ CƠ SỞ 1 " + b1Raw;

    let b2 = item.b2 || "";
    let b3 = item.b3 || "";
    let b4 = item.b4 || "";

    let a1 = priceMap['A1'], a2 = priceMap['A2'], a3 = priceMap['A3'], a4 = priceMap['A4'];

    let amt1 = item.qty1 * a1.price;
    let amt2 = item.qty2 * a2.price;
    let amt3 = item.qty3 * a3.price;
    let amt4 = item.qty4 * a4.price;
    let totalAmt = amt1 + amt2 + amt3 + amt4;
    let totalText = docSoThanhChu(totalAmt);
    let totalContractAmount = a1.contractAmount + a2.contractAmount + a3.contractAmount + a4.contractAmount;

    let docHTML = `
        <div class="doc-quoc-hieu">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</div>

        <div class="doc-title">BIÊN BẢN BÀN GIAO NGHIỆM THU HÀNG HÓA TỪNG THÁNG</div>
        <span class="doc-subtitle">(Tháng &nbsp;&nbsp;&nbsp;&nbsp;${escapeHtml(monthOnly)}/2026)</span>

        <p class="doc-p" style="text-indent: 40px;">Căn cứ Hợp đồng kinh tế số &nbsp;&nbsp;&nbsp;&nbsp;/2026/HAN-CH ngày &nbsp;&nbsp;&nbsp;&nbsp; tháng &nbsp;&nbsp;&nbsp;&nbsp; năm 2026 giữa Thuế thành phố Hà Nội và Công ty Cổ phần In Hà Nội về việc thực hiện gói thầu: “Cung cấp nước uống đóng bình cho các Thuế cơ sở thuộc Thuế thành phố Hà Nội”;</p>
        <p class="doc-p" style="text-indent: 40px;">Căn cứ thực tế bàn giao với ${escapeHtml(b1)} trong tháng.</p>
        <p class="doc-p" style="text-indent: 40px;">Hôm nay, ngày &nbsp;&nbsp;&nbsp;&nbsp; tháng &nbsp;&nbsp;&nbsp;&nbsp; năm 2026, tại ${escapeHtml(b1)}, địa chỉ: ${escapeHtml(b2)}, chúng tôi gồm có:</p>
        
        <p class="doc-indent-p"><strong>${escapeHtml(b1Upper)}</strong></p>
        <p class="doc-indent-p">Địa chỉ: ${escapeHtml(b2)}</p>
        <p class="doc-indent-p">Điện thoại: 02438515469</p>
        <p class="doc-indent-p">Đại diện là Ông/ Bà: ${escapeHtml(b3)} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Chức vụ: ${escapeHtml(b4)}</p>

        <p class="doc-indent-p" style="margin-top: 10px;"><strong>Nhà thầu:</strong></p>
        <p class="doc-indent-p">Tên nhà thầu: <strong>CÔNG TY CỔ PHẦN IN HÀ NỘI</strong></p>
        <p class="doc-indent-p">Địa chỉ: Lô 6B, CN5 Cụm Công nghiệp Ngọc Hồi, Xã Ngọc Hồi, TP Hà Nội</p>
        <p class="doc-indent-p">Điện thoại: 024. 39437063</p>
        <p class="doc-indent-p">Tài khoản: 69425969 Tại: Ngân hàng TMCP Á Châu – Chi nhánh Hoàng Cầu – Phòng giao dịch Huỳnh Thúc Kháng</p>
        <p class="doc-indent-p">Mã số thuế: 0101181842</p>
        <p class="doc-indent-p">Đại diện là Bà: Nguyễn Thị Oanh</p>
        <p class="doc-indent-p">Chức vụ: Tổng giám đốc</p>
