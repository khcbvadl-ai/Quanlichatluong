<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUẢN LÝ & TẠO BÁO CÁO NGHIỆM THU</title>
  <style>
    :root {
      --primary-color: #1a73e8;
      --success-color: #27ae60;
      --bg-color: #f4f6f9;
    }
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: var(--bg-color); }
    .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: var(--primary-color); text-align: center; margin-bottom: 25px; text-transform: uppercase; font-size: 22px; }
    
    .filter-box { display: flex; gap: 20px; background: #eef2f7; padding: 18px; border-radius: 8px; margin-bottom: 20px; align-items: center; }
    .filter-item { display: flex; align-items: center; gap: 10px; }
    label { font-weight: bold; color: #333; }
    select { padding: 8px 12px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; outline: none; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: center; font-size: 14px; }
    th { background-color: #f8f9fa; color: #333; font-weight: 600; }
    tr:nth-child(even) { background-color: #fafafa; }

    .btn-group { margin-top: 20px; text-align: right; display: flex; justify-content: flex-end; gap: 10px; }
    .btn { padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; transition: background 0.2s; }
    .btn-preview { background-color: var(--primary-color); color: #fff; }
    .btn-preview:hover { background-color: #1557b0; }
    .btn-export { background-color: var(--success-color); color: #fff; }
    .btn-export:hover { background-color: #219150; }
    .btn:disabled { background-color: #b0bec5; cursor: not-allowed; }

    /* Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #fff; width: 80%; max-width: 850px; max-height: 90vh; overflow-y: auto; padding: 30px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); position: relative; }
    .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #666; }
    .doc-preview { font-family: 'Times New Roman', serif; font-size: 14pt; line-height: 1.4; color: #000; text-align: justify; }
    .doc-preview h3, .doc-preview h4 { text-align: center; margin: 5px 0; }
    .doc-preview table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    .doc-preview table th, .doc-preview table td { border: 1px solid #000; padding: 6px; font-size: 12pt; }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top: 2px solid transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <h2>QUẢN LÝ & TẠO BÁO CÁO NGHIỆM THU</h2>

  <div class="filter-box">
    <div class="filter-item">
      <label>Chọn Tháng:</label>
      <select id="monthSelect" onchange="applyFilter()">
        <option value="1">Tháng 1</option><option value="2">Tháng 2</option>
        <option value="3">Tháng 3</option><option value="4">Tháng 4</option>
        <option value="5">Tháng 5</option><option value="6">Tháng 6</option>
        <option value="7">Tháng 7</option><option value="8" selected>Tháng 8</option>
        <option value="9">Tháng 9</option><option value="10">Tháng 10</option>
        <option value="11">Tháng 11</option><option value="12">Tháng 12</option>
      </select>
    </div>
    <div class="filter-item">
      <label>Chọn Đơn Vị:</label>
      <select id="unitSelect" onchange="applyFilter()"></select>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Tháng</th>
        <th>Đơn vị (B1)</th>
        <th>Sản phẩm</th>
        <th>Đơn giá</th>
        <th>Lũy kế trước</th>
        <th>Đợt này</th>
        <th>Thành tiền đợt này</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div class="btn-group">
    <button class="btn btn-preview" onclick="openPreviewModal()">👁️ Xem trước biên bản</button>
    <button id="btnExport" class="btn btn-export" onclick="exportWordReport()">📄 Xuất File Word (.docx)</button>
  </div>
</div>

<!-- MODAL PREVIEW -->
<div id="previewModal" class="modal-overlay">
  <div class="modal-content">
    <span class="close-modal" onclick="closePreviewModal()">&times;</span>
    <div id="modalBody" class="doc-preview"></div>
    <div style="text-align: right; margin-top: 20px;">
      <button id="btnExportModal" class="btn btn-export" onclick="exportWordReport()">📄 Tải File Word (.docx)</button>
    </div>
  </div>
</div>

<script>
  // 🔴 THAY LINK WEB APP GOOGLE APPS SCRIPT CỦA THẦY VÀO ĐÂY
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx...THAY_URL_CUA_THAY.../exec";
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1G2SbJcyAy1GYwe16cwaMmphRMaA609ow5l53aHwVw_w/pub?output=csv";

  // Cấu hình danh mục mặt hàng & Đơn giá
  const productCatalog = [
    { key: 'qty1', name: "Nước khoáng", dvt: "Bình", price: 74600 },
    { key: 'qty2', name: "Nước tinh khiết", dvt: "Bình", price: 50000 },
    { key: 'qty3', name: "Bình úp 19L", dvt: "Bình", price: 65000 },
    { key: 'qty4', name: "Nước chai nhỏ", dvt: "Thùng", price: 90000 }
  ];

  // Thông tin quản lý cố định (B2, B3, B4) theo cơ sở B1
  const unitConfigMap = {
    "Thuế cơ sở số 1": { b2: "Số 123 Đường ABC, Hà Nội", b3: "Nguyễn Văn A", b4: "Trưởng cục" },
    "Thuế cơ sở số 2": { b2: "Số 456 Đường XYZ, Hà Nội", b3: "Trần Thị B", b4: "Phó cục trưởng" }
  };

  let rawSheetData = [];
  let currentUnitDataList = [];

  window.onload = function() {
    loadDataFromGoogleSheets();
  };

  // 1. Fetch và Parse CSV từ Google Sheets API
  async function loadDataFromGoogleSheets() {
    try {
      const response = await fetch(SHEET_CSV_URL);
      const csvText = await response.text();
      rawSheetData = parseCSV(csvText);

      // Lấy danh sách các đơn vị duy nhất (B1)
      const units = [...new Set(rawSheetData.map(r => r.b1).filter(Boolean))];
      const unitSelect = document.getElementById('unitSelect');
      unitSelect.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join('');

      applyFilter();
    } catch (err) {
      alert("Lỗi tải dữ liệu từ Google Sheets: " + err.message);
    }
  }

  function parseCSV(text) {
    const lines = text.split('\n');
    const result = [];
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const cols = parseCSVLine(lines[i]);
      result.push({
        thang: cols[0]?.trim(),
        b1: cols[1]?.trim(),
        qty1: parseInt(cols[2]) || 0,
        qty2: parseInt(cols[3]) || 0,
        qty3: parseInt(cols[4]) || 0,
        qty4: parseInt(cols[5]) || 0
      });
    }
    return result;
  }

  function parseCSVLine(line) {
    const values = [];
    let current = '';
    let inQuotes = false;
    for (let char of line) {
      if (char === '"') inQuotes = !inQuotes;
      else if (char === ',' && !inQuotes) { values.push(current); current = ''; }
      else current += char;
    }
    values.push(current);
    return values;
  }

  // 2. Lọc dữ liệu & Tính toán Lũy kế qua các tháng
  function applyFilter() {
    const selectedMonth = parseInt(document.getElementById('monthSelect').value);
    const selectedUnit = document.getElementById('unitSelect').value;

    // Tính lũy kế các tháng trước (tháng < selectedMonth)
    const prevRows = rawSheetData.filter(r => r.b1 === selectedUnit && parseInt(r.thang) < selectedMonth);
    const prevTotals = { qty1: 0, qty2: 0, qty3: 0, qty4: 0 };
    prevRows.forEach(r => {
      prevTotals.qty1 += r.qty1; prevTotals.qty2 += r.qty2;
      prevTotals.qty3 += r.qty3; prevTotals.qty4 += r.qty4;
    });

    // Dữ liệu tháng hiện tại
    const currentMonthRow = rawSheetData.find(r => r.b1 === selectedUnit && parseInt(r.thang) === selectedMonth) || { qty1:0, qty2:0, qty3:0, qty4:0 };

    currentUnitDataList = productCatalog.map(prod => {
      const slLuyKe = prevTotals[prod.key] || 0;
      const slDotNay = currentMonthRow[prod.key] || 0;
      return {
        tenHang: prod.name,
        dvt: prod.dvt,
        donGia: prod.price,
        slLuyKe: slLuyKe,
        tienLuyKe: slLuyKe * prod.price,
        slDotNay: slDotNay,
        tienDotNay: slDotNay * prod.price
      };
    });

    // Vẽ lại bảng preview màn hình chính
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = currentUnitDataList.map(item => `
      <tr>
        <td>${selectedMonth}</td>
        <td>${selectedUnit}</td>
        <td>${item.tenHang}</td>
        <td>${item.donGia.toLocaleString('vi-VN')} đ</td>
        <td>${item.slLuyKe}</td>
        <td>${item.slDotNay}</td>
        <td>${item.tienDotNay.toLocaleString('vi-VN')} đ</td>
      </tr>
    `).join('');
  }

  // 3. Render Modal Preview xem trước Biên bản
  function openPreviewModal() {
    const selectedMonth = document.getElementById('monthSelect').value;
    const selectedUnit = document.getElementById('unitSelect').value;
    const config = unitConfigMap[selectedUnit] || {};
    let tongTien = 0;

    let rowsHtml = currentUnitDataList.map((item, idx) => {
      tongTien += item.tienDotNay;
      return `
        <tr>
          <td style="text-align:center">${idx + 1}</td>
          <td>${item.tenHang}</td>
          <td style="text-align:center">${item.dvt}</td>
          <td style="text-align:right">${item.donGia.toLocaleString('vi-VN')}</td>
          <td style="text-align:center">${item.slLuyKe}</td>
          <td style="text-align:right">${item.tienLuyKe.toLocaleString('vi-VN')}</td>
          <td style="text-align:center">${item.slDotNay}</td>
          <td style="text-align:right">${item.tienDotNay.toLocaleString('vi-VN')}</td>
        </tr>
      `;
    }).join('');

    const modalBody = document.getElementById('modalBody');
    modalBody.innerHTML = `
      <h3>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</h3>
      <h4>Độc lập - Tự do - Hạnh phúc</h4>
      <br>
      <h3 style="text-transform:uppercase">BIÊN BẢN NGHIỆM THU VÀ BÀN GIAO</h3>
      <p>Hai bên cùng thống nhất nghiệm thu và bàn giao số lượng hàng hóa bên B cung cấp cho <b>${selectedUnit}</b> như sau:</p>
      <p><b>1. Nội dung nghiệm thu:</b></p>
      <p>Trong tháng ${selectedMonth}/2026, nhà thầu đã bàn giao cho ${selectedUnit} đầy đủ số lượng và chất lượng theo yêu cầu:</p>
      <table>
        <thead>
          <tr>
            <th>STT</th><th>Danh mục hàng hóa</th><th>ĐVT</th><th>Đơn giá (VND)</th>
            <th>SL lũy kế trước</th><th>Số tiền lũy kế trước</th>
            <th>SL đợt này</th><th>Số tiền đợt này (VND)</th>
          </tr>
        </thead>
        <tbody>
          ${rowsHtml}
        </tbody>
      </table>
      <p><b>Tổng tiền đợt này:</b> ${tongTien.toLocaleString('vi-VN')} VNĐ</p>
      <p><b>Bằng chữ:</b> ${docSoThanhChu(tongTien)}</p>
    `;

    document.getElementById('previewModal').style.display = 'flex';
  }

  function closePreviewModal() {
    document.getElementById('previewModal').style.display = 'none';
  }

  function docSoThanhChu(so) {
    if (so === 0) return "Không đồng";
    return so.toLocaleString('vi-VN') + " đồng";
  }

  // 4. Xuất File Word qua Google Apps Script API
  async function exportWordReport() {
    const btnMain = document.getElementById('btnExport');
    const btnModal = document.getElementById('btnExportModal');
    const selectedMonth = document.getElementById('monthSelect').value;
    const selectedUnit = document.getElementById('unitSelect').value;
    const config = unitConfigMap[selectedUnit] || {};

    let tongTien = 0;
    const itemsPayload = currentUnitDataList.map(item => {
      tongTien += item.tienDotNay;
      return {
        tenHang: item.tenHang,
        dvt: item.dvt,
        donGia: item.donGia.toLocaleString('vi-VN'),
        slLuyKe: item.slLuyKe.toString(),
        tienLuyKe: item.tienLuyKe.toLocaleString('vi-VN'),
        slDotNay: item.slDotNay.toString(),
        tienDotNay: item.tienDotNay.toLocaleString('vi-VN')
      };
    });

    const payload = {
      thang: selectedMonth,
      nam: "2026",
      b1: selectedUnit,
      b2: config.b2 || "",
      b3: config.b3 || "",
      b4: config.b4 || "",
      tongTienDotNay: tongTien.toLocaleString('vi-VN'),
      tongTienBangChu: docSoThanhChu(tongTien),
      items: itemsPayload
    };

    [btnMain, btnModal].forEach(b => { if(b) { b.disabled = true; b.innerHTML = `<span class="spinner"></span> Đang tạo file Word...`; } });

    try {
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === 'success') {
        const byteCharacters = atob(result.base64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });

        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = result.fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } else {
        alert("Lỗi từ Apps Script API: " + result.message);
      }
    } catch (err) {
      alert("Lỗi kết nối API: " + err.message);
    } finally {
      if(btnMain) { btnMain.disabled = false; btnMain.innerHTML = `📄 Xuất File Word (.docx)`; }
      if(btnModal) { btnModal.disabled = false; btnModal.innerHTML = `📄 Tải File Word (.docx)`; }
    }
  }
</script>

</body>
</html>
